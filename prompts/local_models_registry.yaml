# ==============================================================================
# LOCAL MODELS AND RETRIEVAL CONFIGURATION
# ==============================================================================
# This registry combines retrieval runtime defaults with locally available
# FastEmbed models. A model declared below is available to the application; it
# is not downloaded, loaded into RAM, or automatically used merely because its
# `enabled` value is true.
#
# Model activation:
#   dense            Used by a domain configured with embedding_model_key:
#                    local:dense_default.
#   sparse           Used only by domains with vector_type: hybrid. SPLADE
#                    vectors are generated for indexing and hybrid search.
#   late_interaction Used only when a retrieval/evaluation request sets
#                    use_colbert: true.
#   reranker         Used only when local cross-encoder reranking is requested
#                    with enable_cross_encoder_rerank: true.
#
# Model cache:
# Models load lazily on first use into the Python process. They remain in RAM
# until idle for MODEL_CACHE_IDLE_TTL_SECONDS (default: 300 seconds), then are
# released on the next cache access. Set that environment variable to 0 to
# retain models until the application container restarts. Downloaded model files
# persist at ${LOCAL_MODELS_CACHE_PATH}/fastembed_cache.
# ==============================================================================

# Unified retrieval configuration
# Combines runtime configuration (hosted vs local) with local model specifications

retrieval:
  # Runtime defaults (which provider/runtime to use)
  defaults:
    embedding:
      task: embedding
      runtime: fastembed
      provider: local
      model: BAAI/bge-base-en-v1.5
      dimensions: 768
      normalize: true
      batch_size: 32
      device: cpu
      extra: {}
    rerank:
      task: rerank
      enabled: true
      runtime: llm
      provider: openai
      model: openai:gpt-4o-mini
      top_n: 5
      batch_size: 16
      device: null
      extra: {}
    coverage:
      enabled: true
      min_results_per_subquery: 1
      max_reserved: 4

  # Domain-specific runtime overrides
  domains:
    finance:
      embedding:
        task: embedding
        runtime: fastembed
        provider: local
        model: BAAI/bge-base-en-v1.5
        dimensions: 768
        normalize: true
        batch_size: 32
        device: cpu
        extra: {}
      rerank:
        task: rerank
        enabled: true
        runtime: fastembed
        provider: local
        model: BAAI/bge-reranker-base
        top_n: 5
        batch_size: 16
        device: cpu
        extra: {}

# Local model specifications (for FastEmbed)
# Used when provider is "local" in runtime config above
local_models:
  # TIER 1: DENSE (Semantic Vibes)
  dense:
    model_key: "local:dense_default"
    name: "BAAI/bge-base-en-v1.5"
    cache_dir: "${LOCAL_MODELS_CACHE_PATH}/fastembed_cache"
    dimensions: 768
    distance: "Cosine"

  # TIER 1: SPARSE (Lexical/Keyword matching)
  sparse:
    model_key: "local:sparse_default"
    name: "prithivida/Splade_PP_en_v1"
    cache_dir: "${LOCAL_MODELS_CACHE_PATH}/fastembed_cache"
    # Dimensions for sparse are dynamic (vocab size ~30522)
  
  # TIER 2: LATE INTERACTION (Token-level precision for symbols/code)
  late_interaction:
    # Makes this model selectable; it does not enable ColBERT for every search.
    # ColBERT runs only when the request sets use_colbert: true.
    enabled: true 
    model_key: "local:late_interaction_default"
    name: "colbert-ir/colbertv2.0"
    cache_dir: "${LOCAL_MODELS_CACHE_PATH}/fastembed_cache"
    dimensions: 128  # ColBERT uses 128-dim embeddings PER token
    max_length: 512

  # TIER 3: RERANKER (Cross-Encoder for re-ranking)
  reranker:
    # Makes this model selectable; it is loaded only for a request with
    # enable_cross_encoder_rerank: true.
    enabled: true
    model_key: "local:reranker_default"
    name: "BAAI/bge-reranker-base"
    cache_dir: "${LOCAL_MODELS_CACHE_PATH}/fastembed_cache"
