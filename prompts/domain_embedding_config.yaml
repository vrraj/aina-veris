active_domain: semiconductor_datasheets
domains:
  default:
    collection_name: document_index
    profile: legacy-dense
    embedding_model_key: openai:embed_small
    model_type: hosted
    vector_type: null
    search_mode: dense
  mountains:
    collection_name: document_index
    profile: legacy-dense
    embedding_model_key: openai:embed_small
    model_type: hosted
    vector_type: null
    search_mode: dense
  oceans:
    collection_name: document_index_gemini
    profile: legacy-dense
    embedding_model_key: gemini:native-embed
    model_type: hosted
    vector_type: null
    search_mode: dense
  finance:
    collection_name: document_index_finance
    profile: local-hybrid
    embedding_model_key: local:dense_default
    model_type: local
    vector_type: hybrid
    search_mode: hybrid
  backpacking:
    collection_name: document_index_backpack
    profile: local-hybrid
    embedding_model_key: local:dense_default
    model_type: local
    vector_type: hybrid
    search_mode: hybrid
  semiconductor_memory:
    collection_name: document_index_semiconductor_memory
    profile: legacy-dense
    embedding_model_key: openai:embed_small
    model_type: hosted
    vector_type: null
    search_mode: dense
  semiconductor_datasheets:
    collection_name: document_index_semiconductor_datasheets
    # Multi-shard domain: searches the legacy collection plus the Docling
    # shard together (RRF merge). Indexing remains exclusive-write: a
    # document lives in only one shard.
    collections:
      - name: document_index_semiconductor_datasheets_docling_v1
        pipeline: docling
    profile: local-hybrid
    embedding_model_key: local:dense_default
    model_type: local
    vector_type: hybrid
    search_mode: hybrid
  semiconductor_datasheets_docling:
    collection_name: document_index_semiconductor_datasheets_docling_v1
    profile: local-hybrid
    embedding_model_key: local:dense_default
    model_type: local
    vector_type: hybrid
    search_mode: hybrid
  semiconductor_datasheets_docling_mchp:
    collection_name: semi_datasheets_docling_mchp_docling_v1
    profile: local-hybrid
    embedding_model_key: local:dense_default
    model_type: local
    vector_type: hybrid
    search_mode: hybrid
