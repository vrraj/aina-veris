# ==============================================================================
# DOMAIN EMBEDDING CONFIGURATION
# ==============================================================================
# Each domain maps a knowledge base to its Qdrant collection, embedding model,
# vector format, and retrieval strategy. The active domain is used unless a
# request explicitly selects another configured domain.
#
# IMPORTANT — collection migrations:
# Qdrant fixes dense-vector dimensions when a collection is first created.
# Keep an embedding model and collection_name paired permanently, or create a
# new collection/recreate the old one and re-index all documents. For example,
# openai:embed_small produces 1536-dimensional vectors; local:dense_default
# (BAAI/bge-base-en-v1.5) produces 768-dimensional vectors. Changing between
# them while keeping the same collection causes a vector-dimension error.
#
# Vector modes:
#   null    Store and search a single dense vector.
#   dense   Store the dense vector under the named "dense" vector.
#   hybrid  Store dense + SPLADE sparse vectors and use hybrid retrieval.
#            Hybrid indexing and searching load the local SPLADE model even if
#            the dense model is hosted (such as OpenAI or Gemini).
#
# Model cache:
# Local FastEmbed ONNX models are held once per Python process and evicted only
# after MODEL_CACHE_IDLE_TTL_SECONDS of inactivity (default: 300). Their model
# files persist at ${LOCAL_MODELS_CACHE_PATH}/fastembed_cache.
# ==============================================================================

# Default domain selected at application startup. Set ACTIVE_DOMAIN in .env to
# override this without changing the tracked configuration file.
active_domain: semiconductor_datasheets
domains:
  # General-purpose hosted dense retrieval. "null" preserves the legacy,
  # unnamed-Qdrant-vector format.
  default:
    collection_name: document_index
    embedding_model_key: openai:embed_small
    model_type: hosted
    vector_type: null
    search_mode: dense
  mountains:
    collection_name: document_index
    embedding_model_key: openai:embed_small
    model_type: hosted
    vector_type: null
    search_mode: dense
  oceans:
    collection_name: document_index_gemini
    embedding_model_key: gemini:native-embed
    model_type: hosted
    vector_type: null
    search_mode: dense
  finance:
    # Hybrid local retrieval: 768-dim BGE Base dense vectors plus SPLADE sparse
    # vectors. Both are generated during indexing and hybrid searches.
    collection_name: document_index_finance
    embedding_model_key: local:dense_default
    model_type: local
    vector_type: hybrid
    search_mode: hybrid
  backpacking:
    collection_name: document_index_backpack
    embedding_model_key: local:dense_default
    model_type: local
    vector_type: hybrid
    search_mode: hybrid
  semiconductor_memory:
    # Separate hosted dense collection for this domain.
    collection_name: document_index_semiconductor_memory
    embedding_model_key: openai:embed_small
    model_type: hosted
    vector_type: null
    search_mode: dense
  semiconductor_datasheets:
    # Use a dedicated collection for datasheets. Do not reuse a collection that
    # was previously created for a 1536-dimension hosted embedding model.
    collection_name: document_index_semiconductor_datasheets
    embedding_model_key: local:dense_default
    model_type: local
    vector_type: hybrid
    search_mode: hybrid
