name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify dependency lock
        run: |
          python -m pip install --upgrade pip pip-tools==7.5.0
          pip-compile --quiet --resolver=legacy --strip-extras --output-file=requirements.lock requirements.txt
          if ! git diff --quiet -- requirements.lock; then
            echo "::error title=Dependency lock is stale::Run 'make lock' and commit requirements.lock."
            git diff -- requirements.lock
            exit 1
          fi

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Syntax check (compile project Python files)
        run: |
          python -m compileall backend scripts scripts/qdrant_scripts

      - name: Check YAML syntax
        run: |
          python -c "import yaml; yaml.safe_load(open('prompts/prompt_registry.yaml'))"
          python -c "import yaml; yaml.safe_load(open('docs/_config.yml'))"

      - name: Run test suite
        run: |
          python -m pytest
